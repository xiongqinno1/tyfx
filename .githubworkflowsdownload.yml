name: Weekly Download

on:
  schedule:
    # 每周一 03:00 UTC 运行（北京时间 11:00）
    - cron: '0 3 * * 1'
  workflow_dispatch:   # 允许手动触发测试

permissions:
  contents: write      # 需要写权限把 output 提交回仓库

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run script
        run: python test.py

      - name: Commit output (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: update downloads [skip ci]"
            git push
          fi

      # 也可选：把 output 作为 artifact 上传，而不提交回仓库
      #- name: Upload artifact
        #uses: actions/upload-artifact@v4
        #with:
          #name: downloads
          #path: output/